name: Apply PR3 New Files

on:
  push:
    branches:
      - feat/youtube-private-delivery-closeout

permissions:
  contents: write

jobs:
  apply:
    if: "${{ github.event.head_commit.message == 'ci: stage PR3 new files' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/youtube-private-delivery-closeout
          fetch-depth: 0
      - name: Apply exact reviewed new-file patch
        run: |
          cat .github/pr3-newfiles/chunk-* > /tmp/pr3-newfiles.patch.gz.b64
          base64 -d /tmp/pr3-newfiles.patch.gz.b64 | gzip -d > /tmp/pr3-newfiles.patch
          git apply --index /tmp/pr3-newfiles.patch
          git reset HEAD -- .github/workflows/youtube-private-delivery.yml
          rm -f .github/workflows/youtube-private-delivery.yml
          git rm -r .github/pr3-newfiles .github/workflows/pr3-newfiles-apply.yml
          git diff --cached --check
          git config user.name 'VCOS Delivery Agent'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'feat: add YouTube private delivery authorities and tests'
          git push origin HEAD:feat/youtube-private-delivery-closeout
