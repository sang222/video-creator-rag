name: Apply PR3 Lint Fix

on:
  push:
    branches:
      - feat/youtube-private-delivery-closeout

permissions:
  contents: write

jobs:
  apply:
    if: "${{ github.event.head_commit.message == 'ci: apply PR3 lint fix' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/youtube-private-delivery-closeout
          fetch-depth: 0
      - name: Apply exact reviewed lint patch
        run: |
          cat .github/pr3-lintfix/chunk-* > /tmp/pr3-lint.patch.gz.b64
          base64 -d /tmp/pr3-lint.patch.gz.b64 | gzip -d > /tmp/pr3-lint.patch
          git apply --index /tmp/pr3-lint.patch
          git rm -r .github/pr3-lintfix .github/workflows/pr3-lintfix-apply.yml
          git diff --cached --check
          git config user.name 'VCOS Delivery Agent'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'fix: close private delivery lint gaps'
          git push origin HEAD:feat/youtube-private-delivery-closeout
