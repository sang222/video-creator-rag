name: Apply Voice Implementation

on:
  push:
    branches:
      - feat/market-aware-voice-performance
    paths:
      - .github/workflows/apply-voice-implementation.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/market-aware-voice-performance
          fetch-depth: 0
      - name: Decode and apply implementation
        env:
          PAYLOAD_SHA256: ca2649ec8304153878272d3350fc45eea6dcc1ffb6d59c2d5eab5fd002ed565e
          PAYLOAD_B64: 
        run: |
          printf '%s' "$PAYLOAD_B64" | base64 -d > /tmp/voice-implementation.tgz
          printf '%s  %s\n' "$PAYLOAD_SHA256" /tmp/voice-implementation.tgz | sha256sum -c -
          tar -xzf /tmp/voice-implementation.tgz -C "$GITHUB_WORKSPACE"
          rm -f .github/workflows/apply-voice-implementation.yml
      - name: Commit real implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "feat: add governed market-aware voice authority"
          git push origin HEAD:feat/market-aware-voice-performance
