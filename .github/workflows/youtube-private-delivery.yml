name: YouTube Private Delivery

on:
  push:
    branches:
      - feat/youtube-private-delivery-closeout
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  source-and-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vcos
          POSTGRES_PASSWORD: vcos
          POSTGRES_DB: vcos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vcos -d vcos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      VCOS_DATABASE_URL: postgresql+psycopg://vcos:vcos@localhost:5432/vcos
      VCOS_ENVIRONMENT: test
      VCOS_DISABLE_MEDIA_PROVIDER_CALLS: "true"
      VCOS_DISABLE_UPLOAD_AND_PUBLISH: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]" ruff==0.15.12
      - name: Install native media tools
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - name: Migrate to single head
        run: |
          alembic upgrade head
          test "$(alembic heads | wc -l | tr -d ' ')" = "1"
          test "$(alembic heads | awk '{print $1}')" = "0090_learning_reassessment"
      - name: Delivery and regression tests
        run: >-
          pytest -q
          tests/test_youtube_private_delivery.py
          tests/test_voice_authority.py
          tests/test_voice_execution.py
          tests/test_v2_caption_grouping.py
          tests/test_cross_modal_lineage.py
          tests/test_v2_renderer_reconciliation.py
          tests/test_v2_drive_archive_crash_recovery.py
      - name: Lint delivery runtime
        run: >-
          ruff check --isolated
          app/contracts/channel_policy.py
          app/contracts/production_publish.py
          app/contracts/youtube_delivery.py
          app/db/models/__init__.py
          app/db/models/m7.py
          app/db/models/youtube_delivery.py
          app/api/routes/youtube_delivery.py
          app/main.py
          app/services/youtube_delivery.py
          app/services/production_publish.py
          app/services/long_form_analytics.py
          app/services/m9.py
          app/services/outbox_dispatcher.py
          app/services/pkg1.py
          app/services/production_start_readiness.py
          app/services/security_boundary.py
          app/services/v2_native_effects.py
          app/services/v2_package_readiness.py
          app/services/v2_provider_production.py
          app/services/v2_support_authority.py
          app/workers/production_workflow.py
          alembic/versions/0084_youtube_private_delivery.py
          tests/test_youtube_private_delivery.py
      - name: Compile checks
        run: >-
          python -m compileall -q
          app
          alembic/versions/0084_youtube_private_delivery.py
          tests/test_youtube_private_delivery.py
