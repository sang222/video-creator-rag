name: Closeout Autoformat Temporary

on:
  push:
    branches:
      - feat/series-learning-business-scale-closeout

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]' || github.event.head_commit.message != 'style: apply closeout formatter'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/series-learning-business-scale-closeout
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Ruff
        run: python -m pip install ruff==0.15.12
      - name: Format and fix
        run: |
          ruff format \
            app/services/channel_runtime_bootstrap.py \
            app/services/business_os.py \
            tests/test_architecture_debt_closeout.py
          ruff check --fix --isolated \
            app/services/channel_runtime_bootstrap.py \
            app/services/business_os.py \
            tests/test_architecture_debt_closeout.py
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/services/channel_runtime_bootstrap.py app/services/business_os.py tests/test_architecture_debt_closeout.py
          git commit -m 'style: apply closeout formatter'
          git push origin HEAD:feat/series-learning-business-scale-closeout
