name: Retry Apply Voice Implementation

on:
  push:
    branches:
      - feat/market-aware-voice-performance
    paths:
      - .github/workflows/retry-apply-voice-implementation.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/market-aware-voice-performance
          fetch-depth: 0
      - name: Extract verified staged implementation
        run: |
          python - <<'PY'
          from __future__ import annotations
          import base64
          import hashlib
          import tarfile
          from pathlib import Path

          helper = Path('.github/workflows/apply-voice-implementation.yml')
          expected = 'ca2649ec8304153878272d3350fc45eea6dcc1ffb6d59c2d5eab5fd002ed565e'
          payload = None
          for line in helper.read_text(encoding='utf-8').splitlines():
              stripped = line.strip()
              if stripped.startswith('PAYLOAD_B64: '):
                  payload = stripped.split('PAYLOAD_B64: ', 1)[1]
                  break
          if not payload:
              raise SystemExit('embedded payload not found')
          raw = base64.b64decode(payload, validate=True)
          actual = hashlib.sha256(raw).hexdigest()
          if actual != expected:
              raise SystemExit(f'payload checksum mismatch: {actual}')
          archive = Path('/tmp/voice-implementation.tgz')
          archive.write_bytes(raw)
          with tarfile.open(archive, 'r:gz') as tf:
              tf.extractall(Path('.'))
          PY
          rm -f .github/workflows/apply-voice-implementation.yml
          rm -f .github/workflows/retry-apply-voice-implementation.yml
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          test -f app/contracts/voice_authority.py
          test -f app/db/models/voice_authority.py
          test -f app/services/voice_authority.py
          test -f alembic/versions/0080_voice_authority.py
          test -f tests/test_voice_authority.py
          git commit -m "feat: add governed market-aware voice authority"
          git push origin HEAD:feat/market-aware-voice-performance
