name: Canonical Semantic Language

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  card-e-contracts:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vcos
          POSTGRES_PASSWORD: vcos
          POSTGRES_DB: vcos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vcos -d vcos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      VCOS_DATABASE_URL: postgresql+psycopg://vcos:vcos@localhost:5432/vcos
      VCOS_ENVIRONMENT: test
      VCOS_DISABLE_MEDIA_PROVIDER_CALLS: "true"
      VCOS_DISABLE_UPLOAD_AND_PUBLISH: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]" ruff==0.15.12
      - name: Migrate to the single schema head
        run: |
          alembic upgrade head
          test "$(alembic heads | wc -l | tr -d ' ')" = "1"
          test "$(alembic heads | awk '{print $1}')" = "0091_youtube_publication_v2"
      - name: Card E semantic contract tests
        run: pytest -q tests/test_canonical_semantic_language.py
      - name: Card E semantic contract lint
        run: >-
          ruff check --isolated
          app/contracts/semantic.py
          app/services/semantic.py
          tests/test_canonical_semantic_language.py
      - name: Card E semantic contract compile check
        run: >-
          python -m compileall -q
          app/contracts/semantic.py
          app/services/semantic.py
          tests/test_canonical_semantic_language.py
