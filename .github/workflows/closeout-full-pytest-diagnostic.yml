name: Remaining Debt Full Pytest Diagnostic

on:
  push:
    branches:
      - feat/vcos-remaining-debt-closeout

permissions:
  contents: read

concurrency:
  group: remaining-debt-full-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vcos
          POSTGRES_PASSWORD: vcos
          POSTGRES_DB: vcos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vcos -d vcos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      VCOS_DATABASE_URL: postgresql+psycopg://vcos:vcos@localhost:5432/vcos
      VCOS_ENVIRONMENT: test
      VCOS_DISABLE_MEDIA_PROVIDER_CALLS: "true"
      VCOS_DISABLE_UPLOAD_AND_PUBLISH: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vcos-remaining-debt-closeout
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install runtime and native regression dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" ruff==0.15.12
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - name: Reconstruct audited closeout workspace
        shell: bash
        run: |
          set -euo pipefail
          python tools/finalize_remaining_debt.py
          python tools/finalize_remaining_debt_harness.py
          python tools/finalize_remaining_debt_round2.py
          rm -f app/services/runtime_bootstrap.py
          sed -i '/app\/services\/runtime_bootstrap.py/d' .github/workflows/youtube-private-delivery.yml
          touch tests/__init__.py
          mkdir -p tests/qualification
          touch tests/qualification/__init__.py
          python tools/finalize_remaining_debt_round3.py rc2
          python tools/finalize_remaining_debt_round3.py rc1
          python - <<'PY'
          from pathlib import Path
          path = Path("tests/test_nich1_visual_authority.py")
          text = path.read_text(encoding="utf-8")
          old = '''def test_missing_current_and_historical_visual_authority_fails_closed() -> None:\n    with pytest.raises(\n        NicheContractCompilationError,\n        match="NICHE_CONTRACT_REQUIRED_FIELD_MISSING:visual_source_profile",\n    ):\n        _resolve({})\n'''
          new = '''def test_missing_current_and_historical_visual_authority_fails_closed() -> None:\n    historical = {\n        "visual_source_policy_binding": {\n            "niche_visual_source_profile": "GENERATED_EDITORIAL_FIRST"\n        }\n    }\n    assert _resolve(historical) == "GENERATED_EDITORIAL_FIRST"\n    with pytest.raises(\n        NicheContractCompilationError,\n        match="NICHE_CONTRACT_REQUIRED_FIELD_MISSING:visual_source_profile",\n    ):\n        _resolve({})\n'''
          assert text.count(old) == 1
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          python -m compileall -q app tests
          alembic upgrade head
          test "$(alembic heads | wc -l | tr -d ' ')" = "1"
          test "$(alembic heads | awk '{print $1}')" = "0087_business_os"
      - name: Full repository regression with diagnostic summary
        id: full_pytest
        shell: bash
        run: |
          set +e
          set -o pipefail
          pytest -q 2>&1 | tee /tmp/full-pytest.log
          status=${PIPESTATUS[0]}
          {
            echo '## Full pytest diagnostic'
            echo
            echo "PYTEST_EXIT=$status"
            echo
            echo '```text'
            tail -n 700 /tmp/full-pytest.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
