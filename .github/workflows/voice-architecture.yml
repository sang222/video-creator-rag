name: Voice Architecture

on:
  push:
    branches:
      - feat/market-aware-voice-performance
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  source-and-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vcos
          POSTGRES_PASSWORD: vcos
          POSTGRES_DB: vcos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vcos -d vcos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      VCOS_DATABASE_URL: postgresql+psycopg://vcos:vcos@localhost:5432/vcos
      VCOS_ENVIRONMENT: test
      VCOS_DISABLE_MEDIA_PROVIDER_CALLS: "true"
      VCOS_DISABLE_UPLOAD_AND_PUBLISH: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Migrate to single head
        run: |
          alembic upgrade head
          test "$(alembic heads | awk '{print $1}')" = "0080_voice_authority"
      - name: Voice architecture and regression tests
        run: >-
          pytest -q
          tests/test_voice_authority.py
          tests/test_cross_modal_lineage.py
          tests/test_v2_renderer_reconciliation.py
      - name: Compile checks
        run: python -m compileall -q app alembic/versions/0080_voice_authority.py tests/test_voice_authority.py
