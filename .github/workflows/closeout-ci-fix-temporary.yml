name: Closeout CI Fix Temporary

on:
  push:
    branches:
      - feat/series-learning-business-scale-closeout

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/series-learning-business-scale-closeout
          fetch-depth: 0
      - name: Patch stale migration assertion and CI runtime dependency
        run: |
          python - <<'PY'
          from pathlib import Path

          test_path = Path('tests/test_voice_authority.py')
          test_text = test_path.read_text(encoding='utf-8')
          old_head = 'assert heads == ["0084_youtube_private_delivery"]'
          new_head = 'assert heads == ["0087_business_os_closeout"]'
          if old_head not in test_text:
              raise SystemExit('STALE_HEAD_ASSERTION_NOT_FOUND')
          test_path.write_text(test_text.replace(old_head, new_head), encoding='utf-8')

          workflow_path = Path('.github/workflows/architecture-debt-closeout.yml')
          workflow_text = workflow_path.read_text(encoding='utf-8')
          old_install = '''      - name: Install\n        run: python -m pip install --upgrade pip && python -m pip install -e \".[dev]\" ruff==0.15.12\n'''
          new_install = '''      - name: Install FFmpeg\n        run: sudo apt-get update && sudo apt-get install -y ffmpeg\n      - name: Install\n        run: python -m pip install --upgrade pip && python -m pip install -e \".[dev]\" ruff==0.15.12\n'''
          if old_install not in workflow_text:
              raise SystemExit('INSTALL_BLOCK_NOT_FOUND')
          workflow_path.write_text(workflow_text.replace(old_install, new_install), encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_voice_authority.py .github/workflows/architecture-debt-closeout.yml
          git commit -m 'test: align closeout CI with migration head and ffmpeg'
          git push origin HEAD:feat/series-learning-business-scale-closeout
