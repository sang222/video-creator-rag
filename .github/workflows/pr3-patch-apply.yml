name: Apply PR3 Delivery Patch

on:
  push:
    branches:
      - feat/youtube-private-delivery-closeout

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'ci: stage PR3 delivery patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/youtube-private-delivery-closeout
          fetch-depth: 0
      - name: Apply exact reviewed patch
        run: |
          cat .github/pr3-patch/chunk-* > /tmp/pr3.patch.gz.b64
          base64 -d /tmp/pr3.patch.gz.b64 | gzip -d > /tmp/pr3.patch
          git apply --index /tmp/pr3.patch
          git rm -r .github/pr3-patch .github/workflows/pr3-patch-apply.yml
          git diff --cached --check
          git config user.name 'VCOS Delivery Agent'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'feat: add governed YouTube private delivery'
          git push origin HEAD:feat/youtube-private-delivery-closeout
