name: Architecture Debt Closeout

on:
  push:
    branches:
      - feat/series-learning-business-scale-closeout
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  closeout:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vcos
          POSTGRES_PASSWORD: vcos
          POSTGRES_DB: vcos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vcos -d vcos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      VCOS_DATABASE_URL: postgresql+psycopg://vcos:vcos@localhost:5432/vcos
      VCOS_ENVIRONMENT: test
      VCOS_DISABLE_MEDIA_PROVIDER_CALLS: "true"
      VCOS_DISABLE_UPLOAD_AND_PUBLISH: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]" ruff==0.15.12
      - name: Migrate to one head
        run: |
          alembic upgrade head
          test "$(alembic heads | wc -l | tr -d ' ')" = "1"
          test "$(alembic heads | awk '{print $1}')" = "0087_business_os_closeout"
      - name: Debt closeout tests
        run: pytest -q tests/test_architecture_debt_closeout.py
      - name: Critical regression tests
        run: >-
          pytest -q
          tests/test_youtube_private_delivery.py
          tests/test_voice_authority.py
          tests/test_voice_execution.py
          tests/test_cross_modal_lineage.py
          tests/test_v2_renderer_reconciliation.py
      - name: Ruff
        run: >-
          ruff check --isolated
          app/db/models/architecture_closeout.py
          app/services/series_authority_closeout.py
          app/services/learning_authority_closeout.py
          app/services/audience_delivery_closeout.py
          app/services/business_os.py
          app/services/channel_runtime_bootstrap.py
          app/services/runtime_bootstrap.py
          app/services/scale_closeout.py
          alembic/versions/0085_series_authority_closeout.py
          alembic/versions/0086_learning_authority_closeout.py
          alembic/versions/0087_business_os_closeout.py
          tests/test_architecture_debt_closeout.py
      - name: Compile
        run: >-
          python -m compileall -q
          app/db/models/architecture_closeout.py
          app/services/series_authority_closeout.py
          app/services/learning_authority_closeout.py
          app/services/audience_delivery_closeout.py
          app/services/business_os.py
          app/services/channel_runtime_bootstrap.py
          app/services/runtime_bootstrap.py
          app/services/scale_closeout.py
          alembic/versions/0085_series_authority_closeout.py
          alembic/versions/0086_learning_authority_closeout.py
          alembic/versions/0087_business_os_closeout.py
          tests/test_architecture_debt_closeout.py
