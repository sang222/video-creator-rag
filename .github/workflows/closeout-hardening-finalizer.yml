name: Remaining Debt Patch Recovery

on:
  push:
    branches:
      - feat/vcos-remaining-debt-closeout

permissions:
  contents: write

jobs:
  recover:
    if: ${{ !contains(github.event.head_commit.message, '[patch-recovered]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vcos-remaining-debt-closeout
          fetch-depth: 0
      - name: Recover readable prefix from truncated payload
        shell: bash
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          data = ''.join(Path('tools/closeout-hardening.patch.gz.b64').read_text(encoding='utf-8').split())
          data += '=' * (-len(data) % 4)
          Path('/tmp/hardening.gz').write_bytes(base64.b64decode(data, validate=False))
          PY
          set +e
          gzip -dc /tmp/hardening.gz > tools/closeout-hardening.recovered.patch 2> tools/closeout-hardening.recovery.err
          echo "gzip_exit=$?" >> tools/closeout-hardening.recovery.err
          set -e
          wc -c tools/closeout-hardening.recovered.patch >> tools/closeout-hardening.recovery.err
          grep '^diff --git ' tools/closeout-hardening.recovered.patch >> tools/closeout-hardening.recovery.err || true
      - name: Commit recovered payload
        run: |
          git config user.name "sang222"
          git config user.email "quangsang222@gmail.com"
          git add tools/closeout-hardening.recovered.patch tools/closeout-hardening.recovery.err
          git commit -m "chore: recover hardening payload prefix [patch-recovered]"
          git push origin HEAD:feat/vcos-remaining-debt-closeout
