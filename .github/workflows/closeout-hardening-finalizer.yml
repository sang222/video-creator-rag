name: Remaining Debt Hardening Extractor

on:
  push:
    branches:
      - feat/vcos-remaining-debt-closeout

permissions:
  contents: write

jobs:
  extract:
    if: ${{ !contains(github.event.head_commit.message, '[hardening-extracted]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vcos-remaining-debt-closeout
          fetch-depth: 0
      - name: Decode frozen hardening patch
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode tools/closeout-hardening.patch.gz.b64 > /tmp/closeout-hardening.patch.gz
          gzip -t /tmp/closeout-hardening.patch.gz
          gzip -dc /tmp/closeout-hardening.patch.gz > tools/closeout-hardening.patch
          test -s tools/closeout-hardening.patch
      - name: Commit decoded patch
        run: |
          git config user.name "sang222"
          git config user.email "quangsang222@gmail.com"
          git add tools/closeout-hardening.patch
          git commit -m "chore: expose hardening patch [hardening-extracted]"
          git push origin HEAD:feat/vcos-remaining-debt-closeout
