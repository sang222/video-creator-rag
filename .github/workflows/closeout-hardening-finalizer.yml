name: Remaining Debt Hardening Finalizer

on:
  push:
    branches:
      - feat/vcos-remaining-debt-closeout

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vcos
          POSTGRES_PASSWORD: vcos
          POSTGRES_DB: vcos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vcos -d vcos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      VCOS_DATABASE_URL: postgresql+psycopg://vcos:vcos@localhost:5432/vcos
      VCOS_ENVIRONMENT: test
      VCOS_DISABLE_MEDIA_PROVIDER_CALLS: "true"
      VCOS_DISABLE_UPLOAD_AND_PUBLISH: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vcos-remaining-debt-closeout
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install system runtime
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Python runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Decode hardening payload
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          data = ''.join(Path('tools/closeout-hardening.patch.gz.b64').read_text(encoding='utf-8').split())
          data += '=' * (-len(data) % 4)
          raw = base64.b64decode(data, validate=False)
          Path('/tmp/closeout-hardening.patch.gz').write_bytes(raw)
          print('decoded_bytes', len(raw))
          PY
      - name: Validate hardening gzip
        run: gzip -t /tmp/closeout-hardening.patch.gz
      - name: Extract hardening patch
        run: |
          gzip -dc /tmp/closeout-hardening.patch.gz > /tmp/closeout-hardening.patch
          test -s /tmp/closeout-hardening.patch
          grep '^diff --git ' /tmp/closeout-hardening.patch
      - name: Check hardening patch applies
        run: git apply --check --3way --whitespace=nowarn /tmp/closeout-hardening.patch
      - name: Apply hardening patch
        run: |
          git apply --3way --whitespace=nowarn /tmp/closeout-hardening.patch
          rm -f tools/closeout-hardening.patch.gz.b64
          rm -f .github/workflows/closeout-hardening-finalizer.yml
      - name: Validate migration chain
        run: |
          alembic upgrade head
          test "$(alembic heads | wc -l | tr -d ' ')" = "1"
          test "$(alembic heads | awk '{print $1}')" = "0087_business_os"
      - name: Validate focused and production regressions
        shell: bash
        run: |
          files=(tests/test_remaining_debt_closeout.py tests/test_youtube_private_delivery.py tests/test_production_publish.py tests/test_long_form_launch_cadence.py tests/test_editorial_novelty.py tests/test_cross_modal_lineage.py tests/test_v2_renderer_reconciliation.py tests/test_voice_authority.py tests/test_voice_execution.py)
          existing=()
          for candidate in "${files[@]}"; do [[ -f "$candidate" ]] && existing+=("$candidate"); done
          pytest -q "${existing[@]}"
      - name: Validate static authority
        run: |
          ruff check app/services/remaining_debt_closeout.py app/services/production_publish.py app/services/channel_profile.py app/services/profile_compiler.py app/services/m5.py app/services/nich1.py app/contracts/channel_policy.py app/services/pkg1.py app/services/pkg1_market_revision.py tests/test_remaining_debt_closeout.py
          ruff format --check app/services/remaining_debt_closeout.py app/services/production_publish.py app/services/channel_profile.py app/services/profile_compiler.py app/services/m5.py app/services/nich1.py app/contracts/channel_policy.py app/services/pkg1.py app/services/pkg1_market_revision.py tests/test_remaining_debt_closeout.py
          python -m compileall -q app tests/test_remaining_debt_closeout.py
          python - <<'PY'
          from pathlib import Path
          from app.services.remaining_debt_closeout import ArchitectureDebtAuditService
          result = ArchitectureDebtAuditService().audit(Path.cwd())
          assert result.one_engine_many_profiles, result
          print(result)
          PY
          git diff --check
      - name: Commit validated hardening
        run: |
          git config user.name "sang222"
          git config user.email "quangsang222@gmail.com"
          git add -A
          git diff --cached --quiet && { echo 'No hardening diff to commit'; exit 1; }
          git commit -m "fix: harden remaining debt closeout authority"
          git push origin HEAD:feat/vcos-remaining-debt-closeout
