name: Remaining Debt Closeout Finalizer

on:
  push:
    branches:
      - feat/vcos-remaining-debt-closeout

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[debt-closeout-finalized]') }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vcos
          POSTGRES_PASSWORD: vcos
          POSTGRES_DB: vcos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vcos -d vcos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      VCOS_DATABASE_URL: postgresql+psycopg://vcos:vcos@localhost:5432/vcos
      VCOS_ENVIRONMENT: test
      VCOS_DISABLE_MEDIA_PROVIDER_CALLS: "true"
      VCOS_DISABLE_UPLOAD_AND_PUBLISH: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vcos-remaining-debt-closeout
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install runtime and native regression dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" ruff==0.15.12
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - name: Verify removed compiler overlays have no callers
        shell: bash
        run: |
          set -euo pipefail
          for symbol in build_ch1_market_v3_profile_input build_ch1_market_v3_policy refresh_qualified_visual_source_binding; do
            if git grep -n "$symbol" -- 'app/**' ':!app/services/profile_compiler.py'; then
              echo "unexpected active caller for $symbol" >&2
              exit 1
            fi
          done
      - name: Apply frozen debt and gap fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          def sub_once(text: str, pattern: str, replacement: str, *, flags=0, label: str) -> str:
              new, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f"{label}: expected one replacement, got {count}")
              return new

          # ------------------------------------------------------------------
          # P3: remove active channel-specific/dead compiler overlays while
          # preserving the one generic ChannelProfileCompiler execution path.
          # ------------------------------------------------------------------
          path = Path('app/services/profile_compiler.py')
          text = path.read_text()
          for old in ('import hashlib\n', 'import json\n', 'from copy import deepcopy\n'):
              text = text.replace(old, '')
          text = text.replace('    ChannelVisualSourcePolicyBinding,\n', '')
          text = text.replace('    GeminiImageUsagePolicy,\n', '')
          text = text.replace('from app.contracts.visual_routing import NicheVisualSourceProfile, VisualSourceRoute\n', '')
          text = sub_once(
              text,
              r'\n    def refresh_qualified_visual_source_binding\(.*?(?=\n    def compile\()',
              '\n',
              flags=re.S,
              label='remove legacy profile overlays',
          )
          start_marker = '            visual_binding = scoped_policy.get("visual_source_policy_binding") or {}\n'
          end_marker = '            payload["activation_required"] = bool(\n'
          start = text.find(start_marker)
          if start != -1:
              end = text.find(end_marker, start)
              if end == -1:
                  raise SystemExit('legacy visual compile block end not found')
              text = text[:start] + text[end:]
          text = text.replace(
              '        visual_binding = self._validated_visual_source_binding(policy)\n',
              '        visual_binding = policy.visual_source_policy_binding\n',
          )
          text = sub_once(
              text,
              r'        if visual_binding is not None:\n            decision_log\.extend\(.*?(?=        if policy\.target_market_profile is not None:)',
              '        if visual_binding is not None:\n'
              '            decision_log.append(\n'
              '                {"decision": "VISUAL_SOURCE_POLICY_BINDING", "result": "BOUND"}\n'
              '            )\n',
              flags=re.S,
              label='generic visual decision log',
          )
          text = sub_once(
              text,
              r'\n    def _validated_visual_source_binding\(.*?(?=\n    def load_catalogs\()',
              '\n',
              flags=re.S,
              label='remove superseded visual qualification runtime',
          )
          forbidden = (
              'build_ch1_', 'CH1_FLEX', 'CH1_MARKET', 'small-team-ai',
              'STOCK_ASSISTED', 'PEXELS_FAILURE_OPENS_AI',
          )
          found = [token for token in forbidden if token in text]
          if found:
              raise SystemExit(f'profile compiler still contains active channel/dead markers: {found}')
          path.write_text(text)

          # ------------------------------------------------------------------
          # D15/P1/P2/P3 closeout service hardening.
          # ------------------------------------------------------------------
          path = Path('app/services/remaining_debt_closeout.py')
          text = path.read_text()
          text = text.replace('from sqlalchemy import func, select\n', 'from sqlalchemy import and_, func, or_, select\n')
          import_anchor = 'from app.core.time import utc_now\n'
          imports = (
              'from app.db.models.long_form_analytics import LongFormAnalyticsWindow\n'
              'from app.db.models.m8 import AnalyticsSnapshot, MetricAvailabilitySnapshot\n'
              'from app.db.models.ops import CostEvent\n'
              'from app.db.models.workflow import VideoProject\n'
          )
          if imports not in text:
              text = text.replace(import_anchor, import_anchor + imports)
          constants_anchor = 'SEVERITIES = frozenset({"LOW", "MEDIUM", "HIGH", "CRITICAL"})\n'
          constants = '''SEVERITIES = frozenset({"LOW", "MEDIUM", "HIGH", "CRITICAL"})
TRUSTED_SOURCE_CONFIDENCE = frozenset({"HIGH", "VERIFIED", "ACTION_READY"})
ANALYTICS_DATA_AUTHORITY_POLICY = {
    "version": "vcos.analytics-data-authority.v1",
    "platform": "YOUTUBE",
    "freshness": "FRESH",
    "accepted_source_confidence": ["MEDIUM", "HIGH"],
    "required_metrics": {
        "H24": ["views", "impressions"],
        "H72": ["views", "impressions"],
        "D7": ["views", "impressions", "average_view_duration_seconds", "average_view_percentage"],
        "D30": ["views", "impressions", "average_view_duration_seconds", "average_view_percentage"],
        "M11": ["views", "impressions", "average_view_duration_seconds", "average_view_percentage"],
    },
}
'''
          text = text.replace(constants_anchor, constants)

          # Keep the old immutable row writer private and expose only a canonical
          # M8/long-form-window backed authority constructor.
          text = text.replace('    def record_analytics_window(\n', '    def _record_analytics_window(\n', 1)
          marker = '    def _record_analytics_window(\n'
          canonical_method = '''    @staticmethod
    def analytics_data_authority_decision(
        *,
        snapshot: Any,
        availability: Any,
        source_window: Any,
        requested_window_key: str,
    ) -> dict[str, Any]:
        window_key = _enum(requested_window_key, ANALYTICS_WINDOWS, "ANALYTICS_WINDOW_INVALID")
        _require(str(snapshot.platform).upper() == "YOUTUBE", "ANALYTICS_PLATFORM_AUTHORITY_INVALID")
        _require(snapshot.freshness_state == "FRESH", "ANALYTICS_SOURCE_STALE")
        _require(availability is not None, "ANALYTICS_AVAILABILITY_AUTHORITY_MISSING")
        _require(availability.uploaded_video_id == snapshot.uploaded_video_id, "ANALYTICS_AVAILABILITY_SCOPE_MISMATCH")
        _require(availability.analytics_sync_run_id == snapshot.analytics_sync_run_id, "ANALYTICS_AVAILABILITY_RUN_MISMATCH")
        _require(availability.platform == snapshot.platform, "ANALYTICS_AVAILABILITY_PLATFORM_MISMATCH")
        _require(availability.freshness_state == "FRESH", "ANALYTICS_AVAILABILITY_STALE")
        source_confidence = str(snapshot.confidence_level).upper()
        availability_confidence = str(availability.confidence_level).upper()
        accepted = set(ANALYTICS_DATA_AUTHORITY_POLICY["accepted_source_confidence"])
        _require(source_confidence in accepted, "ANALYTICS_SOURCE_CONFIDENCE_INSUFFICIENT")
        _require(availability_confidence in accepted, "ANALYTICS_AVAILABILITY_CONFIDENCE_INSUFFICIENT")
        _require(source_window is not None, "ANALYTICS_LONG_FORM_WINDOW_AUTHORITY_MISSING")
        expected_source_window = "D30" if window_key == "M11" else window_key
        _require(source_window.window_type == expected_source_window, "ANALYTICS_WINDOW_AUTHORITY_MISMATCH")
        _require(source_window.uploaded_video_id == snapshot.uploaded_video_id, "ANALYTICS_WINDOW_VIDEO_SCOPE_MISMATCH")
        _require(source_window.analytics_snapshot_id == snapshot.id, "ANALYTICS_WINDOW_SNAPSHOT_MISMATCH")
        _require(source_window.state == "DIAGNOSTICS_COMPLETE", "ANALYTICS_DIAGNOSTICS_NOT_COMPLETE")
        required_metrics = ANALYTICS_DATA_AUTHORITY_POLICY["required_metrics"][window_key]
        availability_blob = dict(availability.availability_blob or {})
        missing = [
            metric
            for metric in required_metrics
            if (availability_blob.get(metric) or {}).get("state") != "AVAILABLE"
        ]
        _require(not missing, "ANALYTICS_REQUIRED_METRICS_INCOMPLETE:" + ",".join(sorted(missing)))
        normalized = dict(snapshot.normalized_metrics_blob or {})
        def metric_value(key: str) -> int | None:
            detail = normalized.get(key) or {}
            value = detail.get("value")
            if value is None:
                return None
            return int(value)
        views = metric_value("views")
        impressions = metric_value("impressions")
        sample_size = max(int(views or 0), 0)
        confidence_state = (
            "ACTION_READY" if source_confidence == "HIGH" and window_key in {"D30", "M11"}
            else "STABLE" if source_confidence == "HIGH"
            else "DIRECTIONAL"
        )
        maturity_state = "TOO_EARLY" if window_key in {"H24", "H72"} else "MATURE"
        policy_hash = _hash(ANALYTICS_DATA_AUTHORITY_POLICY)
        return {
            "window_key": window_key,
            "source_version": f"{ANALYTICS_DATA_AUTHORITY_POLICY['version']}:{snapshot.id}",
            "maturity_state": maturity_state,
            "confidence_state": confidence_state,
            "sample_size": sample_size,
            "impressions": impressions,
            "views": views,
            "source_snapshot_refs": [
                f"analytics-snapshot://{snapshot.id}",
                f"metric-availability://{availability.id}",
                f"long-form-analytics-window://{source_window.id}",
            ],
            "evidence_payload": {
                "authority_policy": ANALYTICS_DATA_AUTHORITY_POLICY,
                "authority_policy_hash": policy_hash,
                "analytics_snapshot_id": str(snapshot.id),
                "metric_availability_snapshot_id": str(availability.id),
                "long_form_analytics_window_id": str(source_window.id),
                "source_freshness": snapshot.freshness_state,
                "source_confidence": source_confidence,
            },
            "matured_at": getattr(source_window, "observed_to", None) or snapshot.captured_at,
        }

    def record_analytics_window_from_snapshot(
        self,
        *,
        analytics_snapshot_id: uuid.UUID,
        requested_window_key: str,
    ) -> AnalyticsEvidenceWindow:
        snapshot = self.session.get(AnalyticsSnapshot, analytics_snapshot_id)
        if snapshot is None:
            raise NotFoundError(f"analytics snapshot not found: {analytics_snapshot_id}")
        availability = self.session.scalar(
            select(MetricAvailabilitySnapshot)
            .where(
                MetricAvailabilitySnapshot.uploaded_video_id == snapshot.uploaded_video_id,
                MetricAvailabilitySnapshot.analytics_sync_run_id == snapshot.analytics_sync_run_id,
            )
            .order_by(MetricAvailabilitySnapshot.captured_at.desc())
        )
        source_window = (
            self.session.get(LongFormAnalyticsWindow, snapshot.long_form_analytics_window_id)
            if snapshot.long_form_analytics_window_id is not None
            else None
        )
        decision = self.analytics_data_authority_decision(
            snapshot=snapshot,
            availability=availability,
            source_window=source_window,
            requested_window_key=requested_window_key,
        )
        return self._record_analytics_window(
            company_id=snapshot.company_id,
            channel_workspace_id=snapshot.channel_workspace_id,
            uploaded_video_id=snapshot.uploaded_video_id,
            **decision,
        )

'''
          if canonical_method not in text:
              text = text.replace(marker, canonical_method + marker, 1)

          # Comparable evidence is DB-derived from the deterministic fingerprint,
          # not trusted from a caller supplied number.
          old = '''        reasons: list[str] = []
        if window.maturity_state != "MATURE":
            reasons.append("ANALYTICS_NOT_MATURE")
        if window.confidence_state not in {"DIRECTIONAL", "STABLE", "ACTION_READY"}:
            reasons.append("ANALYTICS_CONFIDENCE_INSUFFICIENT")
        if current_policy_hash != fingerprint.profile_snapshot_hash:
            reasons.append("SYSTEM_PROMOTION_POLICY_RECHECK_FAILED")
        if comparable_count < 1:
            reasons.append("COMPARABLE_EVIDENCE_MISSING")
        if window.window_key in {"D30", "M11"} and comparable_count < 3:
            reasons.append("PROMOTION_COMPARABLE_COUNT_INSUFFICIENT")
'''
          new = '''        derived_comparable_count = int(
            self.session.scalar(
                select(func.count(LearningEquivalenceFingerprint.id)).where(
                    LearningEquivalenceFingerprint.channel_workspace_id == fingerprint.channel_workspace_id,
                    LearningEquivalenceFingerprint.fingerprint == fingerprint.fingerprint,
                )
            )
            or 0
        )
        caller_comparable_count = comparable_count
        comparable_count = derived_comparable_count
        reasons: list[str] = []
        if caller_comparable_count != derived_comparable_count:
            reasons.append("COMPARABLE_COUNT_AUTHORITY_MISMATCH")
        if window.maturity_state != "MATURE":
            reasons.append("ANALYTICS_NOT_MATURE")
        if window.confidence_state not in {"DIRECTIONAL", "STABLE", "ACTION_READY"}:
            reasons.append("ANALYTICS_CONFIDENCE_INSUFFICIENT")
        if current_policy_hash != fingerprint.profile_snapshot_hash:
            reasons.append("SYSTEM_PROMOTION_POLICY_RECHECK_FAILED")
        if comparable_count < 1:
            reasons.append("COMPARABLE_EVIDENCE_MISSING")
        if window.window_key in {"D30", "M11"} and comparable_count < 3:
            reasons.append("PROMOTION_COMPARABLE_COUNT_INSUFFICIENT")
'''
          if old not in text:
              raise SystemExit('learning comparable block not found')
          text = text.replace(old, new, 1)
          text = text.replace('            state="ELIGIBLE",\n            plan_hash=digest,\n', '            state="ACTIVE",\n            plan_hash=digest,\n            activated_at=utc_now(),\n', 1)

          # Replace P&L construction with CostEvent-derived actual provider costs,
          # correct PENDING/REVERSED semantics and high-confidence revenue gating.
          pnl_pattern = r'    def build_channel_pnl\(.*?(?=\n    def evaluate_self_funding\()'
          pnl_replacement = '''    def build_channel_pnl(
        self,
        *,
        company_id: uuid.UUID,
        channel_workspace_id: uuid.UUID,
        period_start: datetime,
        period_end: datetime,
        currency: str,
        direct_cost: Decimal | str | float | int | None = None,
        allocated_ops_cost: Decimal | str | float | int = Decimal("0"),
        calculation_version: str = "vcos.channel-pnl.v2",
    ) -> ChannelPnlSnapshot:
        rows = list(
            self.session.scalars(
                select(RevenueSnapshot).where(
                    RevenueSnapshot.channel_workspace_id == channel_workspace_id,
                    RevenueSnapshot.period_start >= period_start,
                    RevenueSnapshot.period_end <= period_end,
                    RevenueSnapshot.currency == currency.upper(),
                )
            ).all()
        )
        buckets = {key: Decimal("0") for key in REVENUE_STATES}
        for row in rows:
            if row.amount_state in {"LOCKED", "FINALIZED", "PAID", "REVERSED"}:
                _require(row.confidence_state in TRUSTED_SOURCE_CONFIDENCE, "REVENUE_SOURCE_CONFIDENCE_INSUFFICIENT")
                _require(row.source_updated_at >= row.period_end, "REVENUE_SOURCE_NOT_MATURE")
            buckets[row.amount_state] += Decimal(row.amount)
        derived_direct, cost_rows = self._actual_direct_cost(
            channel_workspace_id=channel_workspace_id,
            period_start=period_start,
            period_end=period_end,
            currency=currency,
        )
        if direct_cost is not None:
            _require(_decimal(direct_cost) == derived_direct, "ACTUAL_COST_AUTHORITY_MISMATCH")
        direct = derived_direct
        ops = _decimal(allocated_ops_cost)
        contribution = (
            buckets["LOCKED"]
            + buckets["FINALIZED"]
            + buckets["PAID"]
            - buckets["REVERSED"]
            - direct
            - ops
        )
        source_refs = [f"revenue://{row.id}" for row in rows] + [
            f"cost-event://{row.id}" for row in cost_rows
        ]
        payload = {
            "schema_version": calculation_version,
            "channel_workspace_id": channel_workspace_id,
            "period_start": period_start,
            "period_end": period_end,
            "currency": currency.upper(),
            "buckets": buckets,
            "direct_cost": direct,
            "allocated_ops_cost": ops,
            "contribution_margin": contribution,
            "source_snapshot_refs": source_refs,
        }
        digest = _hash(payload)
        existing = self.session.scalar(
            select(ChannelPnlSnapshot).where(
                ChannelPnlSnapshot.channel_workspace_id == channel_workspace_id,
                ChannelPnlSnapshot.period_start == period_start,
                ChannelPnlSnapshot.period_end == period_end,
                ChannelPnlSnapshot.calculation_version == calculation_version,
            )
        )
        if existing is not None:
            if existing.content_hash != digest:
                raise ConflictError("CHANNEL_PNL_IMMUTABLE_CONFLICT")
            return existing
        row = ChannelPnlSnapshot(
            id=_deterministic_id(_BUSINESS_NAMESPACE, payload),
            company_id=company_id,
            channel_workspace_id=channel_workspace_id,
            period_start=period_start,
            period_end=period_end,
            currency=currency.upper(),
            estimated_revenue=buckets["ESTIMATED"],
            locked_revenue=buckets["LOCKED"],
            finalized_revenue=buckets["FINALIZED"],
            cash_received=buckets["PAID"],
            reversed_revenue=buckets["REVERSED"],
            direct_cost=direct,
            allocated_ops_cost=ops,
            contribution_margin=contribution,
            calculation_version=calculation_version,
            source_snapshot_refs=source_refs,
            content_hash=digest,
        )
        self.session.add(row)
        self.session.flush()
        return row

    def _actual_direct_cost(
        self,
        *,
        channel_workspace_id: uuid.UUID,
        period_start: datetime,
        period_end: datetime,
        currency: str,
    ) -> tuple[Decimal, list[CostEvent]]:
        project_ids = select(VideoProject.id).where(
            VideoProject.channel_workspace_id == channel_workspace_id
        )
        cost_rows = list(
            self.session.scalars(
                select(CostEvent).where(
                    CostEvent.currency == currency.upper(),
                    CostEvent.created_at >= period_start,
                    CostEvent.created_at < period_end,
                    CostEvent.cost_type.in_({"ACTUAL", "ADJUSTED", "REFUNDED"}),
                    or_(
                        and_(
                            CostEvent.cost_scope_type == "CHANNEL",
                            CostEvent.cost_scope_id == channel_workspace_id,
                        ),
                        and_(
                            CostEvent.cost_scope_type == "PROJECT",
                            CostEvent.cost_scope_id.in_(project_ids),
                        ),
                    ),
                )
            ).all()
        )
        total = Decimal("0")
        for event in cost_rows:
            amount = Decimal(event.amount)
            total += -amount if event.cost_type == "REFUNDED" else amount
        return _decimal(max(total, Decimal("0"))), cost_rows
'''
          text = sub_once(text, pnl_pattern, pnl_replacement, flags=re.S, label='replace P&L authority')

          old_monetization = '''        if (
            monetization is None
            or monetization.enrollment_state != "ACTIVE"
            or monetization.restriction_state not in {"NONE", "CLEAR"}
        ):
            reasons.append("MONETIZATION_NOT_ACTIVE")
'''
          new_monetization = '''        if (
            monetization is None
            or monetization.platform != "YOUTUBE"
            or monetization.enrollment_state != "ACTIVE"
            or monetization.restriction_state not in {"NONE", "CLEAR"}
        ):
            reasons.append("MONETIZATION_NOT_ACTIVE")
        elif (
            monetization.confidence_state not in TRUSTED_SOURCE_CONFIDENCE
            or monetization.valid_until is None
            or monetization.valid_until < assessment_window_end
            or monetization.source_updated_at > assessment_window_end
        ):
            reasons.append("MONETIZATION_SOURCE_NOT_CURRENT")
'''
          text = text.replace(old_monetization, new_monetization, 1)
          old_payment = '''        if (
            payment is None
            or payment.tax_state != "VERIFIED"
            or payment.address_verification_state != "VERIFIED"
            or payment.payment_method_state != "READY"
            or payment.payment_hold_state not in {"NONE", "CLEAR"}
        ):
            reasons.append("PAYMENT_PROFILE_NOT_READY")
'''
          new_payment = '''        if (
            payment is None
            or payment.tax_state != "VERIFIED"
            or payment.address_verification_state != "VERIFIED"
            or payment.payment_method_state != "READY"
            or payment.payment_hold_state not in {"NONE", "CLEAR"}
        ):
            reasons.append("PAYMENT_PROFILE_NOT_READY")
        elif (
            payment.confidence_state not in TRUSTED_SOURCE_CONFIDENCE
            or payment.valid_until is None
            or payment.valid_until < assessment_window_end
            or payment.source_updated_at > assessment_window_end
        ):
            reasons.append("PAYMENT_SOURCE_NOT_CURRENT")
'''
          text = text.replace(old_payment, new_payment, 1)
          text = text.replace(
              '''                trusted = Decimal(snapshot.locked_revenue) + Decimal(
                    snapshot.finalized_revenue
                ) + Decimal(snapshot.cash_received)
''',
              '''                trusted = (
                    Decimal(snapshot.locked_revenue)
                    + Decimal(snapshot.finalized_revenue)
                    + Decimal(snapshot.cash_received)
                    - Decimal(snapshot.reversed_revenue)
                )
''',
              1,
          )

          # Deterministic action-first capital recommendation.  It never changes
          # a niche/channel automatically; PIVOT/KILL_REVIEW remain human review actions.
          marker = '    def open_enforcement_incident(\n'
          continuation_method = '''    def continuation_recommendation(
        self,
        *,
        channel_workspace_id: uuid.UUID,
    ) -> dict[str, Any]:
        assessment = self.session.scalar(
            select(SelfFundingAssessment)
            .where(SelfFundingAssessment.channel_workspace_id == channel_workspace_id)
            .order_by(SelfFundingAssessment.assessment_window_end.desc())
        )
        pnl = list(
            self.session.scalars(
                select(ChannelPnlSnapshot)
                .where(ChannelPnlSnapshot.channel_workspace_id == channel_workspace_id)
                .order_by(ChannelPnlSnapshot.period_end.desc())
                .limit(2)
            ).all()
        )
        high_enforcement = self.session.scalar(
            select(PlatformEnforcementIncident.id).where(
                PlatformEnforcementIncident.channel_workspace_id == channel_workspace_id,
                PlatformEnforcementIncident.state == "OPEN",
                PlatformEnforcementIncident.severity.in_({"HIGH", "CRITICAL"}),
            )
        )
        reasons: list[str] = []
        if high_enforcement is not None:
            action = "THROTTLE"
            reasons.append("HIGH_ENFORCEMENT_OPEN")
        elif len(pnl) < 2 or assessment is None:
            action = "THROTTLE"
            reasons.append("INSUFFICIENT_MATURE_BUSINESS_EVIDENCE")
        elif all(Decimal(item.contribution_margin) < 0 for item in pnl):
            action = "KILL_REVIEW"
            reasons.append("TWO_NEGATIVE_CONTRIBUTION_CYCLES")
        elif assessment.decision == "SELF_FUNDING" and all(
            Decimal(item.contribution_margin) >= 0 for item in pnl
        ):
            action = "CONTINUE"
            reasons.append("SELF_FUNDING_WITH_NONNEGATIVE_CYCLES")
        elif any(Decimal(item.contribution_margin) < 0 for item in pnl):
            action = "PIVOT"
            reasons.append("ECONOMIC_MODEL_REVIEW_REQUIRED")
        else:
            action = "THROTTLE"
            reasons.append("SELF_FUNDING_NOT_YET_PROVEN")
        return {
            "action": action,
            "reason_codes": tuple(reasons),
            "human_decision_required": action in {"PIVOT", "KILL_REVIEW"},
