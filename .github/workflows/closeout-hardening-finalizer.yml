name: Remaining Debt Diagnostic Capture

on:
  push:
    branches:
      - feat/vcos-remaining-debt-closeout

permissions:
  contents: write

jobs:
  diagnose:
    if: ${{ !contains(github.event.head_commit.message, '[diagnostic-v2]') }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vcos
          POSTGRES_PASSWORD: vcos
          POSTGRES_DB: vcos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vcos -d vcos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      VCOS_DATABASE_URL: postgresql+psycopg://vcos:vcos@localhost:5432/vcos
      VCOS_ENVIRONMENT: test
      VCOS_DISABLE_MEDIA_PROVIDER_CALLS: "true"
      VCOS_DISABLE_UPLOAD_AND_PUBLISH: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vcos-remaining-debt-closeout
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Migrate
        run: alembic upgrade head
      - name: Capture exact CI surface
        shell: bash
        run: |
          set +e
          files=(tests/test_remaining_debt_closeout.py)
          for candidate in tests/test_long_form_launch_cadence.py tests/test_production_publish.py tests/test_youtube_private_delivery.py tests/test_editorial_novelty.py tests/test_cross_modal_lineage.py tests/test_v2_renderer_reconciliation.py; do
            [[ -f "$candidate" ]] && files+=("$candidate")
          done
          echo "FILES=${files[*]}" > tools/remaining-debt-diagnostic.log
          pytest -q "${files[@]}" >> tools/remaining-debt-diagnostic.log 2>&1
          echo "pytest_exit=$?" >> tools/remaining-debt-diagnostic.log
          python - <<'PY' >> tools/remaining-debt-diagnostic.log 2>&1
          from pathlib import Path
          from app.services.remaining_debt_closeout import ArchitectureDebtAuditService
          print('AUDIT', ArchitectureDebtAuditService().audit(Path.cwd()))
          PY
          echo "audit_exit=$?" >> tools/remaining-debt-diagnostic.log
          set -e
      - name: Commit diagnostics
        run: |
          git config user.name "sang222"
          git config user.email "quangsang222@gmail.com"
          git add tools/remaining-debt-diagnostic.log
          git commit -m "chore: capture exact closeout diagnostics [diagnostic-v2]"
          git push origin HEAD:feat/vcos-remaining-debt-closeout
