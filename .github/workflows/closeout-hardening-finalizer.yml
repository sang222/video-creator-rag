name: Remaining Debt Closeout Finalizer

on:
  push:
    branches:
      - feat/vcos-remaining-debt-closeout

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[debt-closeout-finalized]') }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vcos
          POSTGRES_PASSWORD: vcos
          POSTGRES_DB: vcos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vcos -d vcos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      VCOS_DATABASE_URL: postgresql+psycopg://vcos:vcos@localhost:5432/vcos
      VCOS_ENVIRONMENT: test
      VCOS_DISABLE_MEDIA_PROVIDER_CALLS: "true"
      VCOS_DISABLE_UPLOAD_AND_PUBLISH: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vcos-remaining-debt-closeout
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install runtime and native regression dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" ruff==0.15.12
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - name: Verify dead bootstrap is not imported
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n 'runtime_bootstrap' -- 'app/**' ':!app/services/runtime_bootstrap.py'; then
            echo "runtime_bootstrap still has an active app caller" >&2
            exit 1
          fi
      - name: Apply frozen debt and gap fixes
        run: python tools/finalize_remaining_debt.py
      - name: Remove superseded per-channel bootstrap
        shell: bash
        run: |
          set -euo pipefail
          rm -f app/services/runtime_bootstrap.py
          sed -i '/app\/services\/runtime_bootstrap.py/d' .github/workflows/youtube-private-delivery.yml
      - name: Compile source before DB tests
        run: python -m compileall -q app tests/test_remaining_debt_closeout.py
      - name: Migrate PostgreSQL to one current head
        run: |
          alembic upgrade head
          test "$(alembic heads | wc -l | tr -d ' ')" = "1"
          test "$(alembic heads | awk '{print $1}')" = "0087_business_os"
      - name: Run closeout and critical production regressions
        shell: bash
        run: |
          set -euo pipefail
          files=(tests/test_remaining_debt_closeout.py)
          for candidate in \
            tests/test_long_form_launch_cadence.py \
            tests/test_youtube_private_delivery.py \
            tests/test_editorial_novelty.py \
            tests/test_cross_modal_lineage.py \
            tests/test_v2_renderer_reconciliation.py \
            tests/test_voice_authority.py \
            tests/test_voice_execution.py; do
            if [[ -f "$candidate" ]]; then files+=("$candidate"); fi
          done
          printf 'running: %s\n' "${files[*]}"
          pytest -q "${files[@]}"
      - name: Run repository architecture invariant
        run: >-
          python -c "from pathlib import Path; from app.services.remaining_debt_closeout import ArchitectureDebtAuditService; result=ArchitectureDebtAuditService().audit(Path.cwd()); print(result); assert result.one_engine_many_profiles, result"
      - name: Ruff changed closeout surfaces
        run: >-
          ruff check --isolated
          app/services/profile_compiler.py
          app/services/production_publish.py
          app/services/remaining_debt_closeout.py
          tests/test_remaining_debt_closeout.py
      - name: Remove one-shot staging and push verified hardening
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/closeout-hardening-finalizer.yml tools/finalize_remaining_debt.py
          git config user.name "sang222"
          git config user.email "quangsang222@gmail.com"
          git add -A
          git diff --cached --stat
          git -c core.hooksPath=/dev/null commit --no-verify -m "fix: close audited D15 P1 P2 P3 gaps [debt-closeout-finalized]"
          git push origin HEAD:feat/vcos-remaining-debt-closeout
