name: Remaining Debt Closeout Finalizer

on:
  push:
    branches:
      - feat/vcos-remaining-debt-closeout

permissions:
  contents: write

concurrency:
  group: remaining-debt-finalizer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[debt-closeout-finalized]') }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vcos
          POSTGRES_PASSWORD: vcos
          POSTGRES_DB: vcos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vcos -d vcos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      VCOS_DATABASE_URL: postgresql+psycopg://vcos:vcos@localhost:5432/vcos
      VCOS_ENVIRONMENT: test
      VCOS_DISABLE_MEDIA_PROVIDER_CALLS: "true"
      VCOS_DISABLE_UPLOAD_AND_PUBLISH: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vcos-remaining-debt-closeout
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install runtime and native regression dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" ruff==0.15.12
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - name: Verify frozen dead bootstrap invariant
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n 'runtime_bootstrap' -- 'app/**' ':!app/services/runtime_bootstrap.py'; then
            echo "runtime_bootstrap still has an active app caller" >&2
            exit 1
          fi
      - name: Apply already-audited frozen closeout patches
        run: |
          python tools/finalize_remaining_debt.py
          python tools/finalize_remaining_debt_harness.py
          python tools/finalize_remaining_debt_round2.py
      - name: Remove superseded per-channel bootstrap
        shell: bash
        run: |
          set -euo pipefail
          rm -f app/services/runtime_bootstrap.py
          sed -i '/app\/services\/runtime_bootstrap.py/d' .github/workflows/youtube-private-delivery.yml
          touch tests/__init__.py
          mkdir -p tests/qualification
          touch tests/qualification/__init__.py
      - name: Apply RC-2 test-data factory fix only
        run: python tools/finalize_remaining_debt_round3.py rc2
      - name: Compile before RC-2 proof
        run: python -m compileall -q app tests
      - name: Migrate PostgreSQL to one current head
        run: |
          alembic upgrade head
          test "$(alembic heads | wc -l | tr -d ' ')" = "1"
          test "$(alembic heads | awk '{print $1}')" = "0087_business_os"
      - name: RC-2 isolated novelty regressions
        shell: bash
        run: |
          set -euo pipefail
          tests=(
            'tests/test_editorial_novelty.py::test_novelty_gate_legally_rejects_an_equivalent_greenlight'
            'tests/test_editorial_novelty.py::test_novelty_uses_active_stage_not_same_subject_forever[GREENLIT-BLOCK]'
            'tests/test_editorial_novelty.py::test_novelty_uses_active_stage_not_same_subject_forever[SELECTED_FOR_SLOT-BLOCK]'
            'tests/test_editorial_novelty.py::test_novelty_uses_active_stage_not_same_subject_forever[IN_PRODUCTION-BLOCK]'
            'tests/test_editorial_novelty.py::test_novelty_uses_active_stage_not_same_subject_forever[REJECTED-PASS]'
            'tests/test_editorial_novelty.py::test_runway_counts_distinct_territories_and_cleanup_is_idempotent'
            'tests/test_editorial_novelty.py::test_cleanup_hard_deletes_only_a_disposable_missing_authority_candidate'
            'tests/test_editorial_novelty.py::test_specificity_gate_blocks_source_label_and_reusable_documentation_review'
            'tests/test_editorial_novelty.py::test_retroactive_specificity_cleanup_rejects_generic_greenlit_without_deleting_lineage'
          )
          test "${#tests[@]}" = "9"
          pytest -q "${tests[@]}"
      - name: Apply RC-1 NICH1 visual-authority fix only
        run: python tools/finalize_remaining_debt_round3.py rc1
      - name: Compile RC-1 surfaces
        run: python -m compileall -q app/services/nich1.py tests/test_nich1_visual_authority.py
      - name: RC-1 isolated long-form and direct visual regressions
        shell: bash
        run: |
          set -euo pipefail
          tests=(
            'tests/test_long_form_launch_cadence.py::test_editorial_research_candidate_has_no_production_side_effect'
            'tests/test_long_form_launch_cadence.py::test_buffer_below_target_reserves_exactly_one_script_qualification_before_admission'
            'tests/test_long_form_launch_cadence.py::test_series_episode_reservation_is_pre_writer_idempotent_and_released_on_supersession'
            'tests/test_long_form_launch_cadence.py::test_structural_block_settles_series_slot_and_releases_capacity_once'
            'tests/test_long_form_launch_cadence.py::test_series_reservation_allocates_sequential_episodes_from_stale_topic_intent'
            'tests/test_long_form_launch_cadence.py::test_unknown_series_writer_outcome_keeps_episode_reserved'
            'tests/test_long_form_launch_cadence.py::test_series_qualification_pass_consumes_the_exact_reserved_episode_once'
            'tests/test_long_form_launch_cadence.py::test_standalone_qualification_to_production_readiness_uses_only_two_llm_calls'
            'tests/test_long_form_launch_cadence.py::test_series_qualification_to_production_readiness_preserves_reserved_lineage'
            'tests/test_long_form_launch_cadence.py::test_qualification_pass_is_the_only_path_to_cadence_admission'
            'tests/test_long_form_launch_cadence.py::test_runway_excludes_terminal_in_production_orphan_but_cadence_cannot_reselect_it'
            'tests/test_long_form_launch_cadence.py::test_workflow_start_blocks_missing_effective_context_before_research_dispatch'
            'tests/test_long_form_launch_cadence.py::test_zero_effect_stale_dead_letter_auto_supersedes_once'
            'tests/test_long_form_launch_cadence.py::test_zero_effect_stale_series_workflow_abandons_capacity_once'
            'tests/test_long_form_launch_cadence.py::test_effectful_stale_dead_letter_is_never_auto_superseded'
            'tests/test_long_form_launch_cadence.py::test_open_mix_admission_filters_series_outside_launch_policy'
          )
          test "${#tests[@]}" = "16"
          pytest -q "${tests[@]}" tests/test_nich1_visual_authority.py
      - name: Previously failing 25 together
        shell: bash
        run: |
          set -euo pipefail
          nv=(
            'tests/test_editorial_novelty.py::test_novelty_gate_legally_rejects_an_equivalent_greenlight'
            'tests/test_editorial_novelty.py::test_novelty_uses_active_stage_not_same_subject_forever[GREENLIT-BLOCK]'
            'tests/test_editorial_novelty.py::test_novelty_uses_active_stage_not_same_subject_forever[SELECTED_FOR_SLOT-BLOCK]'
            'tests/test_editorial_novelty.py::test_novelty_uses_active_stage_not_same_subject_forever[IN_PRODUCTION-BLOCK]'
            'tests/test_editorial_novelty.py::test_novelty_uses_active_stage_not_same_subject_forever[REJECTED-PASS]'
            'tests/test_editorial_novelty.py::test_runway_counts_distinct_territories_and_cleanup_is_idempotent'
            'tests/test_editorial_novelty.py::test_cleanup_hard_deletes_only_a_disposable_missing_authority_candidate'
            'tests/test_editorial_novelty.py::test_specificity_gate_blocks_source_label_and_reusable_documentation_review'
            'tests/test_editorial_novelty.py::test_retroactive_specificity_cleanup_rejects_generic_greenlit_without_deleting_lineage'
          )
          lf=(
            'tests/test_long_form_launch_cadence.py::test_editorial_research_candidate_has_no_production_side_effect'
            'tests/test_long_form_launch_cadence.py::test_buffer_below_target_reserves_exactly_one_script_qualification_before_admission'
            'tests/test_long_form_launch_cadence.py::test_series_episode_reservation_is_pre_writer_idempotent_and_released_on_supersession'
            'tests/test_long_form_launch_cadence.py::test_structural_block_settles_series_slot_and_releases_capacity_once'
            'tests/test_long_form_launch_cadence.py::test_series_reservation_allocates_sequential_episodes_from_stale_topic_intent'
            'tests/test_long_form_launch_cadence.py::test_unknown_series_writer_outcome_keeps_episode_reserved'
            'tests/test_long_form_launch_cadence.py::test_series_qualification_pass_consumes_the_exact_reserved_episode_once'
            'tests/test_long_form_launch_cadence.py::test_standalone_qualification_to_production_readiness_uses_only_two_llm_calls'
            'tests/test_long_form_launch_cadence.py::test_series_qualification_to_production_readiness_preserves_reserved_lineage'
            'tests/test_long_form_launch_cadence.py::test_qualification_pass_is_the_only_path_to_cadence_admission'
            'tests/test_long_form_launch_cadence.py::test_runway_excludes_terminal_in_production_orphan_but_cadence_cannot_reselect_it'
            'tests/test_long_form_launch_cadence.py::test_workflow_start_blocks_missing_effective_context_before_research_dispatch'
            'tests/test_long_form_launch_cadence.py::test_zero_effect_stale_dead_letter_auto_supersedes_once'
            'tests/test_long_form_launch_cadence.py::test_zero_effect_stale_series_workflow_abandons_capacity_once'
            'tests/test_long_form_launch_cadence.py::test_effectful_stale_dead_letter_is_never_auto_superseded'
            'tests/test_long_form_launch_cadence.py::test_open_mix_admission_filters_series_outside_launch_policy'
          )
          test "$(( ${#nv[@]} + ${#lf[@]} ))" = "25"
          pytest -q "${nv[@]}" "${lf[@]}"
      - name: Exact current targeted suite
        shell: bash
        run: |
          set -euo pipefail
          files=(tests/test_remaining_debt_closeout.py tests/test_one_engine_many_profiles.py)
          for candidate in \
            tests/test_long_form_launch_cadence.py \
            tests/test_production_publish.py \
            tests/test_youtube_private_delivery.py \
            tests/test_editorial_novelty.py \
            tests/test_cross_modal_lineage.py \
            tests/test_v2_renderer_reconciliation.py \
            tests/test_voice_authority.py \
            tests/test_voice_execution.py; do
            if [[ -f "$candidate" ]]; then files+=("$candidate"); fi
          done
          collected=$(pytest --collect-only -q "${files[@]}" | grep -c '::')
          echo "TARGETED_COLLECTED=$collected"
          test "$collected" = "115"
          pytest -q "${files[@]}"
      - name: Full repository regression
        run: pytest -q
      - name: Python compile after full regression
        run: python -m compileall -q app tests
      - name: Clean PostgreSQL migration proof
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import psycopg
          with psycopg.connect(
              "postgresql://vcos:vcos@localhost:5432/postgres", autocommit=True
          ) as connection:
              connection.execute("DROP DATABASE IF EXISTS vcos_clean_verify")
              connection.execute("CREATE DATABASE vcos_clean_verify")
          PY
          VCOS_DATABASE_URL=postgresql+psycopg://vcos:vcos@localhost:5432/vcos_clean_verify alembic upgrade head
          test "$(alembic heads | wc -l | tr -d ' ')" = "1"
          test "$(alembic heads | awk '{print $1}')" = "0087_business_os"
      - name: Repository architecture invariant
        run: >-
          python -c "from pathlib import Path; from app.services.remaining_debt_closeout import ArchitectureDebtAuditService; result=ArchitectureDebtAuditService().audit(Path.cwd()); print(result); assert result.one_engine_many_profiles, result"
      - name: Ruff closeout surfaces
        run: |
          ruff check --isolated \
            app/services/m5.py \
            app/services/nich1.py \
            app/services/profile_compiler.py \
            app/services/production_publish.py \
            app/services/remaining_debt_closeout.py \
            tests/conftest.py \
            tests/qualification/conftest.py \
            tests/test_nich1_visual_authority.py \
            tests/test_one_engine_many_profiles.py \
            tests/test_remaining_debt_closeout.py \
            tests/test_voice_authority.py
          ruff format --check \
            app/services/m5.py \
            app/services/nich1.py \
            app/services/profile_compiler.py \
            app/services/production_publish.py \
            app/services/remaining_debt_closeout.py \
            tests/conftest.py \
            tests/qualification/conftest.py \
            tests/test_nich1_visual_authority.py \
            tests/test_one_engine_many_profiles.py \
            tests/test_remaining_debt_closeout.py \
            tests/test_voice_authority.py
      - name: Harden permanent exact-SHA closeout CI
        run: python tools/finalize_remaining_debt_round3.py ci
      - name: Remove one-shot recovery machinery
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/closeout-hardening-finalizer.yml \
            tools/closeout-hardening.patch.gz.b64 \
            tools/closeout-hardening.recovered.patch \
            tools/closeout-hardening.recovery.err \
            tools/finalize_remaining_debt.py \
            tools/finalize_remaining_debt_harness.py \
            tools/finalize_remaining_debt_round2.py \
            tools/finalize_remaining_debt_round3.py \
            tools/remaining-debt-diagnostic.log
      - name: Final diff audit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess

          temporary = [
              ".github/workflows/closeout-hardening-finalizer.yml",
              "tools/closeout-hardening.patch.gz.b64",
              "tools/closeout-hardening.recovered.patch",
              "tools/closeout-hardening.recovery.err",
              "tools/finalize_remaining_debt.py",
              "tools/finalize_remaining_debt_harness.py",
              "tools/finalize_remaining_debt_round2.py",
              "tools/finalize_remaining_debt_round3.py",
              "tools/remaining-debt-diagnostic.log",
          ]
          left = [path for path in temporary if Path(path).exists()]
          assert not left, f"temporary closeout artifacts remain: {left}"
          assert not Path("app/services/runtime_bootstrap.py").exists()
          compiler = Path("app/services/profile_compiler.py").read_text()
          forbidden = (
              "build_ch1_",
              "CH1_FLEX",
              "CH1_MARKET",
              "small-team-ai",
              "STOCK_ASSISTED",
              "PEXELS_FAILURE_OPENS_AI",
          )
          leaked = [token for token in forbidden if token in compiler]
          assert not leaked, f"active profile compiler leakage: {leaked}"
          nich1 = Path("app/services/nich1.py").read_text()
          assert "small-team-ai" not in nich1
          assert "CH1_FLEX" not in nich1
          assert "CH1_MARKET" not in nich1
          diff = subprocess.run(
              ["git", "diff", "--check", "origin/main...HEAD"],
              text=True,
              capture_output=True,
          )
          assert diff.returncode == 0, diff.stdout + diff.stderr
          PY
          git status --short
          git diff --stat origin/main
      - name: Commit and push verified maintainable source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "sang222"
          git config user.email "quangsang222@gmail.com"
          git add -A
          git diff --cached --check
          git diff --cached --stat
          git -c core.hooksPath=/dev/null commit --no-verify -m "fix: close audited D15 P1 P2 P3 gaps"
          git push origin HEAD:feat/vcos-remaining-debt-closeout
          echo "FINAL_SOURCE_COMMIT=$(git rev-parse HEAD)"