    assert assessment.decision == "FUNDED_EXPERIMENT"
    assert "MONETIZATION_SOURCE_NOT_CURRENT" in assessment.reason_codes
    assert "PAYMENT_SOURCE_NOT_CURRENT" in assessment.reason_codes


def test_business_continuation_projection_is_deterministic_and_human_gated(db: Session) -> None:
    company_id, channel_id, _ = _scope()
    service = BusinessMonitoringService(db)
    now = utc_now()
    for offset in (60, 30):
        start = now - timedelta(days=offset)
        end = start + timedelta(days=30)
        db.add(
            ChannelPnlSnapshot(
                id=uuid.uuid4(),
                company_id=company_id,
                channel_workspace_id=channel_id,
                period_start=start,
                period_end=end,
                currency="USD",
                estimated_revenue=0,
                locked_revenue=0,
                finalized_revenue=0,
                cash_received=0,
                reversed_revenue=0,
                direct_cost=Decimal("10"),
                allocated_ops_cost=0,
                contribution_margin=Decimal("-10"),
                calculation_version=f"test-{offset}",
                source_snapshot_refs=[],
                content_hash=("a" if offset == 60 else "b") * 64,
            )
        )
    db.flush()
    projection = service.continuation_recommendation(channel_workspace_id=channel_id)
    assert projection["action"] == "THROTTLE"
    # Without a mature self-funding assessment, capital action cannot jump to kill/pivot.
    assert projection["human_decision_required"] is False


