name: Apply Voice Code Only

on:
  push:
    branches:
      - feat/market-aware-voice-performance
    paths:
      - .github/workflows/apply-voice-code-only.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/market-aware-voice-performance
          fetch-depth: 0
      - name: Assemble verified implementation without workflow mutation
        run: |
          python - <<'PY'
          from __future__ import annotations
          import base64
          import hashlib
          import tarfile
          from pathlib import Path

          parts = sorted(Path('.voice-staging').glob('part-*.b64'))
          if len(parts) != 5:
              raise SystemExit(f'expected 5 payload parts, found {len(parts)}')
          payload = ''.join(part.read_text(encoding='utf-8').strip() for part in parts)
          raw = base64.b64decode(payload, validate=True)
          expected = 'ca2649ec8304153878272d3350fc45eea6dcc1ffb6d59c2d5eab5fd002ed565e'
          actual = hashlib.sha256(raw).hexdigest()
          if actual != expected:
              raise SystemExit(f'payload checksum mismatch: {actual}')
          archive = Path('/tmp/voice-implementation.tgz')
          archive.write_bytes(raw)
          with tarfile.open(archive, 'r:gz') as tf:
              tf.extractall(Path('.'))
          PY
          git checkout HEAD -- .github/workflows/voice-architecture.yml
          rm -rf .voice-staging
      - name: Commit real implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          test -f app/contracts/voice_authority.py
          test -f app/db/models/voice_authority.py
          test -f app/services/voice_authority.py
          test -f alembic/versions/0080_voice_authority.py
          test -f tests/test_voice_authority.py
          git add -A
          git diff --cached --stat
          git diff --cached --name-only | grep -q '^app/contracts/voice_authority.py$'
          if git diff --cached --name-only | grep -q '^.github/workflows/'; then
            echo 'workflow mutation forbidden in code-only commit' >&2
            exit 1
          fi
          git commit -m "feat: add governed market-aware voice authority"
          git push origin HEAD:feat/market-aware-voice-performance
