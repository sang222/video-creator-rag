services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: vcos
      POSTGRES_PASSWORD: vcos
      POSTGRES_DB: vcos
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vcos -d vcos"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - vcos-postgres-data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    env_file:
      - path: .env
        required: false
    environment:
      VCOS_DATABASE_URL: ${VCOS_DOCKER_DATABASE_URL:-postgresql+psycopg://vcos:vcos@postgres:5432/vcos}
      VCOS_LLM_PROVIDER: ${VCOS_LLM_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      VCOS_CORS_ALLOWED_ORIGINS: ${VCOS_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    ports:
      - "${VCOS_API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./var:/app/var
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  production-workflow-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "app.workers"]
    env_file:
      - path: .env
        required: false
    environment:
      VCOS_DATABASE_URL: ${VCOS_DOCKER_DATABASE_URL:-postgresql+psycopg://vcos:vcos@postgres:5432/vcos}
      VCOS_LLM_PROVIDER: ${VCOS_LLM_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      VCOS_WORKFLOW_LEASE_SECONDS: ${VCOS_WORKFLOW_LEASE_SECONDS:-60}
      VCOS_WORKFLOW_MAX_EXECUTION_SECONDS: ${VCOS_WORKFLOW_MAX_EXECUTION_SECONDS:-3600}
      VCOS_WORKFLOW_POLL_INTERVAL_SECONDS: ${VCOS_WORKFLOW_POLL_INTERVAL_SECONDS:-1}
      VCOS_POST_READINESS_GATEWAY_FACTORY: ${VCOS_POST_READINESS_GATEWAY_FACTORY:-}
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./var:/app/var
    restart: unless-stopped
    stop_grace_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_VCOS_API_BASE_URL: ${NEXT_PUBLIC_VCOS_API_BASE_URL:-http://localhost:8000}
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    ports:
      - "${VCOS_FRONTEND_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  vcos-postgres-data:
