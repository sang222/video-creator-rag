            - crypto trading
        voice_style:
          narration_tone: professional calm documentary explainer
          pacing: measured
          allowed_style:
            - evidence-aware
          forbidden_style:
            - hype
        platform_strategy:
          primary_platform: YouTube
          publish_mode: human_handoff_only
          auto_publish_allowed: false
          studio_scraping_allowed: false
        media_policy:
          niche_visual_source_profile: STOCK_ASSISTED
